<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Magazijn Ziekenwagen</title>

<!-- PWA: installeerbaar maken -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16213E">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Magazijn">

<!-- Firebase (compat SDK — geen build-tool nodig) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- QR-scanner -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<!-- QR-generator (voor het afdrukken van labels) -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<style>
  :root {
    --ink: #16213E;
    --paper: #F7F8FA;
    --card: #FFFFFF;
    --line: #E1E4EA;
    --danger: #D7263D;
    --danger-bg: #FDEBEE;
    --ok: #2E8B57;
    --ok-bg: #EAF6EF;
    --muted: #6B7280;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  header {
    background: var(--ink);
    color: white;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 1.15rem;
    margin: 0;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  nav {
    display: flex;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  nav button {
    flex: 1;
    padding: 14px 8px;
    border: none;
    background: none;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
  }
  nav button.active {
    color: var(--ink);
    border-bottom-color: var(--danger);
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 80px;
  }

  .view { display: none; }
  .view.active { display: block; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }

  button.primary {
    width: 100%;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 700;
    color: white;
    background: var(--ink);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  button.primary:active { opacity: 0.85; }

  button.danger {
    background: var(--danger);
  }

  button.secondary {
    width: 100%;
    padding: 14px;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
  }

  #qr-reader {
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 14px;
  }

  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 13px;
    font-size: 1rem;
    border: 2px solid var(--line);
    border-radius: 8px;
    margin-bottom: 12px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .scan-result h2 {
    margin: 0 0 4px;
    font-size: 1.3rem;
  }
  .scan-result .stock-line {
    font-size: 0.95rem;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .toast {
    position: fixed;
    left: 16px; right: 16px; bottom: 16px;
    padding: 14px 18px;
    border-radius: 10px;
    font-weight: 600;
    text-align: center;
    color: white;
    background: var(--ink);
    display: none;
    z-index: 20;
  }
  .toast.show { display: block; }
  .toast.ok { background: var(--ok); }
  .toast.error { background: var(--danger); }

  .item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .item-row.low {
    border-color: var(--danger);
    background: var(--danger-bg);
  }
  .item-row .name { font-weight: 700; }
  .item-row .sub { font-size: 0.82rem; color: var(--muted); }
  .item-row .qty {
    font-weight: 700;
    font-size: 1.1rem;
    text-align: right;
  }
  .item-row.low .qty { color: var(--danger); }

  .badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--danger);
    color: white;
    margin-left: 6px;
    vertical-align: middle;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    font-size: 0.95rem;
  }

  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(22,33,62,0.5);
    display: none;
    align-items: flex-end;
    z-index: 30;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--card);
    width: 100%;
    border-radius: 16px 16px 0 0;
    padding: 22px 18px 26px;
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal h3 { margin-top: 0; }
  .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
  .modal-actions button { flex: 1; }

  #qr-print { text-align: center; margin-top: 10px; }
  #qr-print canvas { margin: 0 auto; }

  .row-2 { display: flex; gap: 10px; }
  .row-2 > div { flex: 1; }
</style>
</head>
<body>

<header>
  <h1>Magazijn Ziekenwagen</h1>
</header>

<nav>
  <button class="tab-btn active" data-view="scan">Scannen</button>
  <button class="tab-btn" data-view="overview">Voorraad</button>
</nav>

<main>

  <!-- SCAN VIEW -->
  <section id="view-scan" class="view active">
    <div class="card">
      <div id="qr-reader"></div>
      <button class="primary" id="btn-start-scan">Start scannen</button>
    </div>

    <div class="card scan-result" id="scan-result-card" style="display:none;">
      <h2 id="scan-item-name"></h2>
      <div class="stock-line" id="scan-item-stock"></div>
      <label for="scan-amount">Aantal genomen</label>
      <input type="number" id="scan-amount" min="1" value="1" inputmode="numeric">
      <button class="primary danger" id="btn-deduct">Afboeken</button>
    </div>
  </section>

  <!-- OVERVIEW VIEW -->
  <section id="view-overview" class="view">
    <button class="primary" id="btn-add-item" style="margin-bottom:16px;">+ Nieuw artikel</button>
    <div id="item-list"></div>
  </section>

</main>

<div class="toast" id="toast"></div>

<!-- MODAL: item toevoegen/bewerken -->
<div class="modal-backdrop" id="item-modal">
  <div class="modal">
    <h3 id="modal-title">Artikel</h3>
    <label for="f-name">Naam</label>
    <input type="text" id="f-name" placeholder="Bv. Infuusset 500ml">

    <label for="f-qr">QR-code (unieke waarde)</label>
    <input type="text" id="f-qr" placeholder="Bv. INF-500-01">

    <div class="row-2">
      <div>
        <label for="f-stock">Huidige voorraad</label>
        <input type="number" id="f-stock" min="0" value="0" inputmode="numeric">
      </div>
      <div>
        <label for="f-min">Minimum</label>
        <input type="number" id="f-min" min="0" value="0" inputmode="numeric">
      </div>
    </div>

    <div id="qr-print"></div>

    <div class="modal-actions">
      <button class="secondary" id="btn-cancel-item">Annuleren</button>
      <button class="primary" id="btn-save-item">Bewaren</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   FIREBASE CONFIG — vul hier je eigen projectgegevens in
   (Firebase console > Projectinstellingen > Algemeen)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBHao9v3GvW-IONs-R2TVDt-vGxMc4fxKE",
  authDomain: "dghmagazijn-d38bf.firebaseapp.com",
  projectId: "dghmagazijn-d38bf",
  storageBucket: "dghmagazijn-d38bf.firebasestorage.app",
  messagingSenderId: "725175536466",
  appId: "1:725175536466:web:6da1c46b81b5dcb0e8888b"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* Service worker registreren — nodig zodat de browser de app
   installeerbaar acht en ze offline kan opstarten. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
const itemsRef = db.collection("items");
const movementsRef = db.collection("movements");

/* =========================================================
   NAVIGATIE
   ========================================================= */
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("view-" + btn.dataset.view).classList.add("active");
  });
});

function showToast(msg, type = "") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show " + type;
  setTimeout(() => t.classList.remove("show"), 2600);
}

/* =========================================================
   SCANNEN + AFBOEKEN
   ========================================================= */
let scanner = null;
let currentItem = null;

document.getElementById("btn-start-scan").addEventListener("click", () => {
  document.getElementById("scan-result-card").style.display = "none";
  if (scanner) return;

  scanner = new Html5Qrcode("qr-reader");
  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 240 },
    onScanSuccess,
    () => {} // scanfouten negeren, blijft proberen
  ).catch(() => {
    showToast("Kan camera niet starten. Controleer toestemming.", "error");
  });
});

async function onScanSuccess(decodedText) {
  await scanner.pause(true);
  const snap = await itemsRef.where("qrCode", "==", decodedText).limit(1).get();

  if (snap.empty) {
    showToast("Geen artikel gevonden voor deze code.", "error");
    scanner.resume();
    return;
  }

  const d = snap.docs[0];
  currentItem = { id: d.id, ...d.data() };

  document.getElementById("scan-item-name").textContent = currentItem.name;
  document.getElementById("scan-item-stock").textContent =
    `Huidige voorraad: ${currentItem.currentStock} (minimum: ${currentItem.minStock})`;
  document.getElementById("scan-amount").value = 1;
  document.getElementById("scan-result-card").style.display = "block";

  await scanner.stop();
  scanner.clear();
  scanner = null;
}

document.getElementById("btn-deduct").addEventListener("click", async () => {
  const amount = parseInt(document.getElementById("scan-amount").value, 10);
  if (!currentItem || !amount || amount <= 0) {
    showToast("Vul een geldig aantal in.", "error");
    return;
  }

  const itemDocRef = itemsRef.doc(currentItem.id);

  try {
    const newStock = await db.runTransaction(async (tx) => {
      const snap = await tx.get(itemDocRef);
      const data = snap.data();
      const updated = (data.currentStock ?? 0) - amount;
      if (updated < 0) throw new Error("Onvoldoende voorraad.");
      tx.update(itemDocRef, { currentStock: updated });
      return updated;
    });

    await movementsRef.add({
      itemId: currentItem.id,
      itemName: currentItem.name,
      amount: -amount,
      resultingStock: newStock,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });

    if (newStock < currentItem.minStock) {
      showToast(`Afgeboekt. Let op: lage voorraad (${newStock}/${currentItem.minStock}).`, "error");
    } else {
      showToast(`Afgeboekt. Nieuwe voorraad: ${newStock}.`, "ok");
    }

    document.getElementById("scan-result-card").style.display = "none";
    currentItem = null;
  } catch (err) {
    showToast(err.message, "error");
  }
});

/* =========================================================
   OVERZICHT
   ========================================================= */
itemsRef.onSnapshot(snap => {
  const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  items.sort((a, b) => {
    const aLow = a.currentStock < a.minStock;
    const bLow = b.currentStock < b.minStock;
    if (aLow !== bLow) return aLow ? -1 : 1;
    return a.name.localeCompare(b.name);
  });
  renderList(items);
});

function renderList(items) {
  const list = document.getElementById("item-list");
  if (items.length === 0) {
    list.innerHTML = `<div class="empty">Nog geen artikelen. Voeg er een toe met "+ Nieuw artikel".</div>`;
    return;
  }
  list.innerHTML = "";
  items.forEach(item => {
    const low = item.currentStock < item.minStock;
    const row = document.createElement("div");
    row.className = "item-row" + (low ? " low" : "");
    row.innerHTML = `
      <div>
        <div class="name">${escapeHtml(item.name)} ${low ? '<span class="badge">LAAG</span>' : ""}</div>
        <div class="sub">min. ${item.minStock}</div>
      </div>
      <div class="qty">${item.currentStock}</div>
    `;
    row.addEventListener("click", () => openItemModal(item));
    list.appendChild(row);
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

/* =========================================================
   ARTIKEL TOEVOEGEN / BEWERKEN
   ========================================================= */
let editingItemId = null;

document.getElementById("btn-add-item").addEventListener("click", () => openItemModal(null));
document.getElementById("btn-cancel-item").addEventListener("click", closeItemModal);

function openItemModal(item) {
  editingItemId = item ? item.id : null;
  document.getElementById("modal-title").textContent = item ? "Artikel bewerken" : "Nieuw artikel";
  document.getElementById("f-name").value = item ? item.name : "";
  document.getElementById("f-qr").value = item ? item.qrCode : "";
  document.getElementById("f-stock").value = item ? item.currentStock : 0;
  document.getElementById("f-min").value = item ? item.minStock : 0;

  const qrPrint = document.getElementById("qr-print");
  qrPrint.innerHTML = "";
  if (item && item.qrCode) {
    const canvas = document.createElement("canvas");
    qrPrint.appendChild(canvas);
    QRCode.toCanvas(canvas, item.qrCode, { width: 160 });
  }

  document.getElementById("item-modal").classList.add("show");
}

function closeItemModal() {
  document.getElementById("item-modal").classList.remove("show");
}

document.getElementById("btn-save-item").addEventListener("click", async () => {
  const name = document.getElementById("f-name").value.trim();
  const qrCode = document.getElementById("f-qr").value.trim();
  const currentStock = parseInt(document.getElementById("f-stock").value, 10) || 0;
  const minStock = parseInt(document.getElementById("f-min").value, 10) || 0;

  if (!name || !qrCode) {
    showToast("Naam en QR-code zijn verplicht.", "error");
    return;
  }

  const data = { name, qrCode, currentStock, minStock };

  try {
    if (editingItemId) {
      await itemsRef.doc(editingItemId).update(data);
    } else {
      await itemsRef.add(data);
    }
    showToast("Bewaard.", "ok");
    closeItemModal();
  } catch (err) {
    showToast("Fout bij bewaren: " + err.message, "error");
  }
});
</script>
</body>
</html>
